global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'dongnemarket-app'
    metrics_path: '/actuator/prometheus'
    # 앱만 5초로 좁힌다. HikariCP 의 pending 같은 게이지는 **순간값**이라 15초 간격으로는
    # 짧게 튀는 포화 신호를 통째로 놓친다 — 커넥션 풀이 1번 병목 후보인데 그 신호를 놓치면
    # 무릎의 원인을 특정할 수 없다. 부하 계단 하나(2.5분)당 표본이 10개에서 30개로 늘어난다.
    # 나머지 잡은 global 15s 그대로 — 하드웨어·DB 는 그 해상도로 충분하다.
    scrape_interval: 5s
    static_configs:
      - targets: ['app:8080']          # 같은 compose 네트워크의 앱 컨테이너
        labels:
          application: 'dongnemarket'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 컨테이너별 자원 — 대시보드 2행
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 호스트(Docker Desktop에서는 리눅스 VM) — 대시보드 4행
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # MySQL 내부 — 대시보드 3행
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']
