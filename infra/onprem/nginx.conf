# 리버스 프록시 — 단일 현관(/ → next, /api → app). onprem·cloud 앱 계층 공용 설정.
# ⚠️ infra/onprem/nginx.conf 와 infra/cloud/app/nginx.conf 는 반드시 동일해야 한다.
#    (폴더 격리 배포라 물리적으로 두 벌이지만 내용은 하나 — CI의 nginx-sync 가드가 일치를 강제한다.
#     의도적으로 분기할 일이 생기면 가드도 함께 조정할 것.)
server {
    listen 80;
    server_name _;

    # Docker 내장 DNS. 변수 proxy_pass와 함께 쓰면 nginx가 요청마다 upstream 이름을
    # 재해석해 컨테이너 재생성(IP 변경) 시에도 502가 나지 않음.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API → Spring (경로 /api/** 그대로 전달)
    location /api/ {
        set $upstream_app app;
        proxy_pass http://$upstream_app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 외 전부 → Next
    location / {
        set $upstream_next next;
        proxy_pass http://$upstream_next:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ── 부하테스트용 지표 노출 ────────────────────────────────────────────────
# nginx 는 기본으로 아무 지표도 내보내지 않는다. 웹 진입 계층에 부하를 걸 때
# **연결이 어디서 막히는지**(활성/대기 연결, accepted 대 handled 격차)를 볼 방법이 없어
# stub_status 를 켠다. 이미지 빌드에 --with-http_stub_status_module 이 포함돼 있다.
#
# **공개 포트(80)에는 붙이지 않는다.** 컨테이너 네트워크 안에서만 열리는 별도 리스너다 —
# 8081 은 호스트로 게시하지 않으므로 nginx-exporter 만 닿는다.
server {
    listen 8081;
    access_log off;

    location = /stub_status {
        stub_status;
    }
    location / { return 404; }
}
