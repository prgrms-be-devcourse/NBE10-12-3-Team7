# 온프레미스(로컬 전체 컨테이너) 배포. nginx·Next·Spring Boot·MySQL·Redis를 한 호스트에 자기완결로 올린다.
# 클라우드(infra/cloud/)와 달리 이미지를 로컬에서 빌드하고, DB도 같은 스택의 MySQL 컨테이너를 쓴다.
# 앱은 prod 프로파일 + FILE_STORAGE_TYPE=local(기본). 클라우드와의 차이는 프로파일이 아니라 env·이미지 출처뿐.
# (설계·경계: ../infra.md)
#
# 사용(이 폴더에서):
#   cp .env.example .env                                       # 값 채우기(.env는 gitignore)
#   (cd ../../backend && ./gradlew clean build -x test)        # 앱 이미지용 JAR 선행 빌드(필수)
#   docker compose --env-file .env up -d --build               # nginx+next+app+mysql+redis
#   docker compose --env-file .env --profile observability up -d --build   # +관측
#   docker compose --env-file .env --profile edge up -d        # +외부 임시 URL(Cloudflare 퀵터널)
name: dongnemarket-onprem

services:
  mysql:
    image: mysql:8.0
    container_name: dongne-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: dongne_market
      MYSQL_USER: ${DB_USERNAME:-dongne}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dongne1234}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dongne-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root1234}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 인증 관련 TTL 데이터(Refresh Token/로그인 실패 제한/이메일 인증 코드/비밀번호 재설정 토큰) 저장소.
  redis:
    image: redis:7-alpine
    container_name: dongne-redis
    restart: unless-stopped
    volumes:
      - dongne-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 관리자 AI 어시스턴트용 Ollama — 온프레미스 스택 내 컨테이너(사내 서버 대체, qwen3:1.7b 통일).
  ollama:
    image: ollama/ollama:latest
    container_name: dongne-ollama
    restart: unless-stopped
    volumes:
      - dongne-ollama-data:/root/.ollama   # 받은 모델 영속화 → 재기동 후 재다운로드 방지
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # one-shot: ollama가 healthy해지면 모델을 pull하고 종료(exit 0). app은 이 완료를 기다린 뒤 기동.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: dongne-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
    entrypoint: ["/bin/sh", "-c", "ollama pull $$OLLAMA_MODEL"]
    restart: "no"

  app:
    build:
      context: ../../backend          # ← 리포 루트 기준(이 폴더에서 두 단계 위)
      dockerfile: Dockerfile
    image: dongnemarket-app:latest
    container_name: dongne-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/dongne_market?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-dongne}
      DB_PASSWORD: ${DB_PASSWORD:-dongne1234}
      JWT_SECRET: ${JWT_SECRET:-dongne-market-local-dev-secret-please-change-0123456789}
      # 인증 관련 TTL 데이터 저장소(같은 스택의 redis 컨테이너)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 관리자 AI(Ollama). 같은 스택의 ollama 컨테이너를 가리킨다(사내 서버 대체, qwen3:1.7b 통일).
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      # 이메일 인증/비밀번호 재설정 메일 발송. 계정 정보는 기본값 없이 .env에서만 관리.
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # 파일 저장소. 온프레미스 기본값은 local(볼륨 마운트). S3로 쓰려면 .env에서
      # FILE_STORAGE_TYPE=s3 + AWS_S3_BUCKET/AWS_REGION + AWS 자격증명(~/.aws 마운트 등)을 직접 준비.
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-local}
      FILE_STORAGE_LOCAL_BASE_PATH: /app/uploads
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    volumes:
      - dongne-uploads:/app/uploads     # local 모드일 때만 실제로 쓰인다(신고 증빙 + 상품 이미지 공용)
    expose:
      - "8080"                          # 외부 노출 대신 nginx 통해서만 접근

  next:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: dongnemarket-next:latest
    container_name: dongne-next
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"                          # nginx 뒤에만

  nginx:
    image: nginx:1.27-alpine
    container_name: dongne-nginx
    restart: unless-stopped
    depends_on:
      - app
      - next
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ── profile "observability": Prometheus · Loki · Grafana · Promtail ──
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.53.2
    container_name: dongne-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-remote-write-receiver'   # k6 → Prometheus remote-write 수신(부하테스트 클라이언트측 p95/p99)

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.1.4
    container_name: dongne-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"                     # ← 3000은 next와 충돌하니 호스트는 3001로
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.1.1
    container_name: dongne-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.1.1
    container_name: dongne-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # ── profile "edge": Cloudflare Quick Tunnel (도메인·토큰 없이 임시 외부 URL) ──
  cloudflared:
    profiles: ["edge"]
    image: cloudflare/cloudflared:latest
    container_name: dongne-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx

volumes:
  dongne-mysql-data:
  dongne-redis-data:
  dongne-ollama-data:
  dongne-uploads:
  prometheus-data:
  grafana-data:
  loki-data:
