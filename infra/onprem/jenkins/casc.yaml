# Jenkins Configuration as Code — UI 클릭 대신 이 파일이 Jenkins 상태를 정의한다.
# 컨테이너를 지우고 다시 만들어도 같은 설정으로 복원된다(포트폴리오 서사: 설정도 코드로).
jenkins:
  systemMessage: "dongnemarket 온프레미스 CD — 설정은 infra/onprem/jenkins/casc.yaml 이 소유한다"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  # 코어의 FullControlOnceLoggedInAuthorizationStrategy에는 JCasC 심볼이 없어 matrix-auth로 지정한다.
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_USER}"
            permissions:
              - "Overall/Administer"

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: >
      pipelineJob('dongnemarket-onprem-cd') {
        description('${JENKINS_TRACK_BRANCH} push 감지 → 이미지 빌드 → Zot push → 온프레미스 스택 재기동')
        triggers {
          scm('H/2 * * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/prgrms-be-devcourse/NBE10-12-3-Team7.git') }
                branch("*/${JENKINS_TRACK_BRANCH}")
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
