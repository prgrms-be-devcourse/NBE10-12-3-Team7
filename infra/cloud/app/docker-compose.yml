# EC2 #1 (app) 전용. mysql 없음 → 외부 DB(RDB EC2). 이미지는 ECR pull.
# Redis·Ollama를 이 EC2에 co-locate. Redis=인증 TTL 데이터(../../infra.md),
# Ollama=관리자 AI(사내 서버 폐기, qwen3:1.7b 통일). 자원 압박 시 전용 EC2 분리 재검토.
# 사용(EC2 #1, 이 폴더에서):
#   docker compose --env-file .env pull
#   docker compose --env-file .env up -d
name: dongnemarket-app

services:
  # 인증 관련 TTL 데이터(Refresh Token/로그인 실패 제한/이메일 인증 코드/비밀번호 재설정 토큰) 저장소.
  # DB(RDB EC2)와 달리 별도 EC2로 분리하지 않고 이 EC2에 co-locate — 최소 변경으로 우선 동작시키는 선택.
  # 트래픽/가용성 요구가 커지면 DB처럼 전용 EC2(또는 ElastiCache)로 분리하는 걸 재검토.
  redis:
    image: redis:7-alpine
    container_name: dongne-redis
    restart: unless-stopped
    volumes:
      - dongne-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 관리자 AI 어시스턴트용 Ollama — 이 앱 EC2에 co-locate(redis와 동급). 사내 Ollama 서버 대체.
  ollama:
    image: ollama/ollama:latest
    container_name: dongne-ollama
    restart: unless-stopped
    volumes:
      - dongne-ollama-data:/root/.ollama   # 받은 모델 영속화 → 재기동 후 재다운로드 방지
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # one-shot: ollama가 healthy해지면 모델을 pull하고 종료(exit 0). app은 이 완료를 기다린 뒤 기동.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: dongne-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
    entrypoint: ["/bin/sh", "-c", "ollama pull $$OLLAMA_MODEL"]
    restart: "no"

  app:
    image: ${ECR_REGISTRY}/dongnemarket-app:${IMAGE_TAG:-latest}
    container_name: dongne-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod           # prometheus 노출(모니터 EC2가 scrape)
      DB_URL: ${DB_URL}                       # ← RDB EC2 프라이빗 IP (.env)
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 인증 관련 TTL 데이터 저장소(같은 EC2의 redis 컨테이너)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_BASE_URL: http://ollama:11434    # 같은 EC2에 co-locate된 ollama 컨테이너
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      # 이메일 인증/비번 재설정 메일 발송(팀 기능). 계정정보는 .env에서만 관리
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # 신고 증빙/상품 이미지 저장소. 이 EC2는 S3 고정 사용 — 자격증명은 주입하지 않고 이 EC2의 IAM Role로 인증한다.
      FILE_STORAGE_TYPE: s3
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    ports:
      - "8080:8080"                           # 호스트 발행(모니터 EC2 Prometheus scrape). SG로 monitoring-sg만 허용

  next:
    image: ${ECR_REGISTRY}/dongnemarket-next:${IMAGE_TAG:-latest}
    container_name: dongne-next
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: dongne-nginx
    restart: unless-stopped
    depends_on:
      - app
      - next
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # ← 같은 폴더의 cloud용 conf

  # 로그 수집 → 모니터링 EC2의 Loki로 push
  promtail:
    image: grafana/promtail:3.1.1
    container_name: dongne-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  dongne-redis-data:
  dongne-ollama-data:
