[project]
name = "marketon-agent"
version = "0.1.0"
description = "마켓온 사용자 도메인 AI 에이전트 — LangGraph + Ollama(qwen3:4b) 독립 FastAPI 서비스"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # --- 인제스트 파이프라인 ---
    "chromadb>=0.5",
    "langchain-text-splitters>=0.3",
    "openai>=1.40",          # NVIDIA NIM (OpenAI 호환) 필터 클라이언트
    "typer>=0.12",           # ingest CLI
    # --- 관측성 ---
    "langsmith>=0.1",        # 개발 트레이싱 (LangGraph 자동 트레이스 + wrap_openai)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",       # FastAPI TestClient
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 라이브 Ollama가 필요한 테스트는 @pytest.mark.live 로 표시하고 기본 실행에서 제외한다.
markers = [
    "live: 실제 Ollama 모델을 호출하는 테스트 (기본 제외, `-m live`로만 실행)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
