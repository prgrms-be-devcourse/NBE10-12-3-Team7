# dev: 호스트 bootRun. 로컬 MySQL(base fallback), 개발 편의(스키마 자동반영·SQL 로그).
spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  # 관리자 AI(Ollama)는 base application.yml에서 이미 localhost:11434 + qwen3:1.7b로 통일됐다.
  # dev는 그 기본값을 그대로 상속한다(호스트 bootRun → 루트 docker-compose의 ollama 컨테이너).
  # 로컬 CPU 추론이 느려(수십 초~분) 기본 read-timeout을 넘겨 AI 호출이 끊기는 것을 방지.
  # non-stream 호출(ChatClient.call())이 쓰는 RestClient가 이 값을 따른다(Spring Boot 3.4+).
  http:
    client:
      read-timeout: 600s
      connect-timeout: 10s

logging:
  level:
    org.hibernate.SQL: debug
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
