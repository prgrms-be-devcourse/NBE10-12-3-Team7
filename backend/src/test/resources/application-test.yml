# 테스트 전용: H2 in-memory (MySQL 미기동 상태에서도 build/test green)
spring:
  # Refresh Token은 test 프로파일에서 JPA 구현(JpaRefreshTokenRepository)을 쓴다. spring-boot-starter-data-redis가
  # 클래스패스에 있으면 프로파일과 무관하게 자동설정이 시도되므로, 외부 Redis 없이도 컨텍스트가 뜨도록 명시적으로 뺀다.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  datasource:
    url: jdbc:h2:mem:dongne_test-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # H2라 Flyway(MySQL 방언 baseline)를 끄고 ddl-auto(create-drop)가 스키마를 만든다.
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

  # 테스트는 EmailSender를 @MockitoBean으로 대체해 실제 발송을 하지 않으므로 값이 없어도 무방하다.
  # 값이 아예 없으면 JavaMailSender 빈 생성 시 플레이스홀더 해석 실패로 컨텍스트 로딩 자체가 깨지므로 빈 값으로 고정한다.
  mail:
    username:
    password:

file:
  storage:
    type: local
    local:
      base-path: build/test-storage
