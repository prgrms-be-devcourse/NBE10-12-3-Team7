plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dongnemarket'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '2.8.6'
	jjwtVersion = '0.12.6'
	springAiVersion = '1.1.8'
	awsSdkVersion = '2.47.1'
}

// Spring AI BOM: spring-ai-* 의존성 버전을 일괄 관리
dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
	}
}

dependencies {
	// Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// WebSocket + STOMP — 실시간 경매(서버↔클라 양방향). @MessageMapping·SimpMessagingTemplate 활성화.
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	// S3 이미지 저장(global/storage). 자격증명은 DefaultCredentialsProvider(로컬 ~/.aws 또는 EC2 IAM 역할).
	implementation 'software.amazon.awssdk:s3'
	// Swagger / OpenAPI (Springdoc)
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// Spring AI (로컬 Ollama 모델 연동, 버전은 spring-ai-bom이 관리)
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

	// JWT (jjwt) — 우리 자체 Access/Refresh Token 발급용
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// 소셜 로그인: Google ID Token(JWS) 서명 검증(JWKS) — NimbusJwtDecoder. 버전은 Spring Boot BOM이 관리.
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	// 소셜 로그인: 카카오/구글 REST API 호출용 WebClient. reactor-core는 이미 classpath에 있지만
	// WebClient의 기본 HTTP 커넥터(reactor-netty-http)는 없어서 명시적으로 추가한다(연결/응답 타임아웃을
	// 정확히 제어하기 위해 auto-detect 대체 커넥터에 기대지 않는다).
	implementation 'io.projectreactor.netty:reactor-netty-http'

	// DB 마이그레이션 (Flyway) — 스키마를 버전드 SQL로 관리. prod는 ddl-auto:validate와 세트.
	// dev/test에서는 spring.flyway.enabled=false로 끄고 ddl-auto가 스키마를 담당한다.
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// DB drivers
	runtimeOnly 'com.mysql:mysql-connector-j'   // 운영/개발 DB
	testRuntimeOnly 'com.h2database:h2'          // 테스트 전용 in-memory

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Testcontainers (RedisRefreshTokenRepositoryTest: 진짜 Redis) — 버전은 Spring Boot BOM이 관리
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	// V3SocialLoginSchemaValidationTest: 진짜 MySQL(운영과 동일 이미지)로 Flyway 스키마 ↔ 엔티티 매핑 검증
	testImplementation 'org.testcontainers:mysql'
	// 소셜 로그인 OAuth Client(Kakao/Google) 테스트: 실제 HTTP 서버로 4xx/5xx/timeout/비정상 응답 재현
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
// 기본 test = 빠른 단위/슬라이스 (H2). integration 태그는 제외
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

// 통합테스트 = 진짜 Redis(Testcontainers). ./gradlew integrationTest
tasks.register('integrationTest', Test) {
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter('test')
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
}
